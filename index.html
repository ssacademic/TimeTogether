<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TimeTogether — where your team is, right now</title>
<style>

  :root{
    --bg: #0B0C13;
    --panel: #1B1F30;
    --panel-raised: #242942;
    --line: #333a56;
    --text: #F3F4F8;
    --text-dim: #9BA0B5;
    --text-faint: #656B85;
    --accent: #F2A65A;
    --accent-soft: rgba(242,166,90,0.18);
    --day: #7C9CFF;
    --night: #0A0B12;
    --good: #6FCF97;
    --focus: #F2A65A;
    --danger: #E37373;
    --danger-soft: rgba(227,115,115,0.14);
    --radius: 14px;
    --row-shadow: 0 3px 14px rgba(0,0,0,0.35);
    --topbar-bg: rgba(11,12,19,0.86);
    --bubble-ring: rgba(11,12,19,0.9);
    --day-fill: rgba(124,156,255,0.22);
    --night-fill: rgba(10,11,18,0.9);
    --mono: 'SFMono-Regular', 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }

  [data-theme="light"]{
    --bg: #F4F5F9;
    --panel: #FFFFFF;
    --panel-raised: #EEF0F7;
    --line: #DDE1EC;
    --text: #1B1F2C;
    --text-dim: #5B6178;
    --text-faint: #8F95AC;
    --accent: #DB8138;
    --accent-soft: rgba(219,129,56,0.14);
    --day: #4C6FE0;
    --night: #E7E9F3;
    --good: #2E9E63;
    --focus: #DB8138;
    --danger: #D14F4F;
    --danger-soft: rgba(209,79,79,0.10);
    --row-shadow: 0 2px 10px rgba(30,35,60,0.08);
    --topbar-bg: rgba(255,255,255,0.86);
    --bubble-ring: rgba(255,255,255,0.9);
    --day-fill: rgba(76,111,224,0.14);
    --night-fill: rgba(140,146,175,0.28);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: radial-gradient(1200px 800px at 15% -10%, var(--panel-raised) 0%, var(--bg) 55%);
    color: var(--text);
    font-family: var(--sans);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    transition: background .2s, color .2s;
  }
  a{color:inherit;}
  button{font-family:inherit;}

  :focus-visible{
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-radius: 6px;
  }

  /* ---------- Top bar ---------- */
  .topbar{
    position: sticky; top:0; z-index:40;
    display:flex; align-items:center; gap:16px;
    padding: 14px 22px;
    background: var(--topbar-bg);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
  }
  .brand{
    display:flex; align-items:baseline; gap:8px;
    font-weight:700; font-size:17px; letter-spacing:-0.01em;
    margin-right: 10px; flex-shrink:0;
  }
  .brand .dot{
    display:inline-block; width:8px; height:8px; border-radius:50%;
    background: var(--accent);
    box-shadow: 0 0 0 4px var(--accent-soft);
  }

  .tabs-wrap{ position:relative; flex:1; min-width:0; }
  .tabs{
    display:flex; align-items:center; gap:6px;
    overflow-x:auto; scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{display:none;}
  .tabs-fade{
    position:absolute; top:0; bottom:0; width:28px;
    pointer-events:none; opacity:0; transition:opacity .15s;
  }
  .tabs-fade-left{ left:0; background:linear-gradient(90deg, var(--bg), transparent); }
  .tabs-fade-right{ right:0; background:linear-gradient(-90deg, var(--bg), transparent); }
  .tabs-fade.show{ opacity:1; }

  .tab{
    display:flex; align-items:center; gap:6px;
    padding:7px 13px;
    border-radius:999px;
    background:transparent;
    border:1px solid transparent;
    color:var(--text-dim);
    font-size:13.5px; font-weight:600;
    cursor:pointer;
    white-space:nowrap;
    transition: background .15s, color .15s, border-color .15s;
  }
  .tab:hover{ color:var(--text); background:var(--panel-raised); }
  .tab.active{
    color: var(--bg);
    background: var(--accent);
  }
  .tab .count{
    font-family:var(--mono); font-size:11px;
    opacity:.75;
  }
  .tab-add{
    display:flex; align-items:center; justify-content:center;
    width:30px; height:30px; border-radius:50%;
    background:var(--panel-raised); color:var(--text-dim);
    border:1px solid var(--line);
    cursor:pointer; font-size:16px; flex-shrink:0;
    transition: background .15s, color .15s;
  }
  .tab-add:hover{ background:var(--line); color:var(--text); }

  .topbar-actions{ display:flex; gap:8px; align-items:center; flex-shrink:0; }
  .icon-btn{
    display:flex; align-items:center; justify-content:center;
    width:34px; height:34px; border-radius:10px;
    background:var(--panel-raised); border:1px solid var(--line);
    color:var(--text-dim); cursor:pointer; font-size:15px;
    transition: background .15s,color .15s;
  }
  .icon-btn:hover{ background:var(--line); color:var(--text); }

  /* ---------- Settings dropdown ---------- */
  .settings-menu{ position:relative; }
  .settings-dropdown{
    position:absolute; top:calc(100% + 8px); right:0;
    background:var(--panel); border:1px solid var(--line);
    border-radius:12px; padding:6px;
    min-width:190px; box-shadow:0 10px 30px rgba(0,0,0,0.35);
    display:none; flex-direction:column; gap:2px;
    z-index:60;
  }
  .settings-dropdown.show{ display:flex; }
  .settings-dropdown button{
    display:flex; align-items:center; gap:10px;
    padding:9px 10px; border-radius:8px;
    background:none; border:none; color:var(--text);
    font-size:13px; font-weight:600; text-align:left;
    cursor:pointer; width:100%;
  }
  .settings-dropdown button:hover{ background:var(--panel-raised); }
  .sd-icon{ width:16px; text-align:center; color:var(--text-dim); }

  /* ---------- Main ---------- */
  .wrap{ max-width:980px; margin:0 auto; padding: 22px 18px 80px; }

  .panel-header{
    display:flex; align-items:flex-end; justify-content:space-between; gap:14px;
    margin-bottom:18px; flex-wrap:wrap;
  }
  .panel-title-row{ display:flex; align-items:center; gap:10px; }
  .header-right{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .sort-toggle{
    display:flex; align-items:center; gap:6px;
    color:var(--text-dim); font-size:12.5px; font-weight:600;
    cursor:pointer; padding:5px 10px; border-radius:8px;
    border:1px solid var(--line); background:var(--panel-raised);
    transition: color .15s, border-color .15s;
    user-select:none;
  }
  .sort-toggle:hover{ color:var(--text); border-color:var(--accent); }
  .sort-toggle.active{ color:var(--accent); border-color:var(--accent); background:var(--accent-soft); }
  .panel-title{
    font-size:22px; font-weight:750; letter-spacing:-0.01em;
    background:transparent; border:none; color:var(--text);
    padding:2px 4px; border-radius:6px; max-width:60vw;
  }
  .panel-title:hover{ background:var(--panel-raised); cursor:text; }
  .rename-hint{ color:var(--text-faint); font-size:11px; }

  .delete-group-btn{
    width:30px; height:30px; border-radius:8px;
    border:1px solid var(--line);
    background:var(--panel-raised); color:var(--danger); opacity:.75;
    cursor:pointer; font-size:14px;
    display:flex; align-items:center; justify-content:center;
    transition: background .15s, color .15s, opacity .15s, border-color .15s;
    flex-shrink:0;
  }
  .delete-group-btn:hover{ background:var(--danger-soft); color:var(--danger); opacity:1; border-color:var(--danger); }
  .delete-group-btn:disabled{ opacity:.25; cursor:not-allowed; color:var(--text-faint); }
  .delete-group-btn:disabled:hover{ background:transparent; color:var(--text-faint); }

  .now-readout{
    font-family:var(--mono); font-size:13px; color:var(--text-dim);
    display:flex; align-items:center; gap:8px;
  }
  .now-readout .pulse{
    width:7px;height:7px;border-radius:50%; background:var(--accent);
    box-shadow:0 0 0 3px var(--accent-soft);
    animation: pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.35;} }

  .add-person-btn{
    display:flex; align-items:center; gap:7px;
    padding:9px 15px; border-radius:10px;
    background:var(--panel-raised); border:1px solid var(--line);
    color:var(--text); font-weight:600; font-size:13.5px;
    cursor:pointer; transition: border-color .15s, background .15s;
  }
  .add-person-btn:hover{ border-color:var(--accent); background:var(--panel); }

  .panel-toolbar{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    margin-bottom:16px;
  }
  .suggest-btn{
    display:flex; align-items:center; gap:7px;
    padding:9px 15px; border-radius:10px;
    background:var(--accent-soft); border:1px solid rgba(242,166,90,0.35);
    color:var(--accent); font-weight:650; font-size:13.5px;
    cursor:pointer; transition: background .15s, border-color .15s;
  }
  .suggest-btn:hover{ background:rgba(242,166,90,0.25); }

  .link-btn{
    display:inline-block; margin-top:8px;
    background:none; border:none; padding:0;
    color:var(--text-dim); font-size:11.5px; text-decoration:underline;
    text-decoration-color:var(--line); cursor:pointer;
  }
  .link-btn:hover{ color:var(--accent); }

  .no-match{ padding:10px 12px; font-size:12.5px; color:var(--text-faint); }

  /* ---------- Suggest meeting times modal ---------- */
  .suggest-people-picker{
    display:flex; flex-wrap:wrap; gap:7px;
    margin-bottom:18px; padding-bottom:16px;
    border-bottom:1px solid var(--line);
  }
  .suggest-picker-chip{
    display:flex; align-items:center; gap:6px;
    padding:5px 10px 5px 6px; border-radius:999px;
    background:var(--panel-raised); border:1px solid var(--line);
    font-size:12.5px; font-weight:600; color:var(--text-faint);
    cursor:pointer; transition: background .15s, border-color .15s, color .15s;
    user-select:none; position:relative;
  }
  .suggest-picker-chip.checked{ color:var(--text); border-color:var(--accent); background:var(--accent-soft); }
  .suggest-picker-chip input{ position:absolute; opacity:0; width:0; height:0; }

  .suggest-slot{
    border:1px solid var(--line); border-radius:12px;
    padding:12px 14px; margin-bottom:10px; background:var(--panel-raised);
  }
  .suggest-slot-head{ display:flex; align-items:center; gap:8px; margin-bottom:4px; }
  .suggest-rank{
    font-family:var(--mono); font-size:11px; font-weight:700;
    color:var(--accent); background:var(--accent-soft);
    padding:2px 7px; border-radius:6px;
  }
  .suggest-when{ font-weight:650; font-size:14px; }
  .suggest-why{ color:var(--text-faint); font-size:12px; margin-bottom:10px; }
  .suggest-why strong{ color:var(--text-dim); }
  .suggest-people{ display:flex; flex-direction:column; gap:6px; }
  .suggest-person{ display:flex; align-items:center; gap:8px; font-size:12.5px; }
  .suggest-name{ font-weight:600; min-width:70px; }
  .suggest-clock{ font-family:var(--mono); color:var(--text-dim); margin-left:auto; }

  /* ---------- Empty state ---------- */
  .empty-state{
    display:flex; flex-direction:column; align-items:center; text-align:center;
    padding: 70px 20px; color:var(--text-dim);
    border:1px dashed var(--line); border-radius:var(--radius);
  }
  .empty-state .glyph{ font-size:34px; margin-bottom:14px; opacity:.9; }
  .empty-state h3{ color:var(--text); margin:0 0 6px; font-size:17px; }
  .empty-state p{ margin:0 0 20px; max-width:360px; font-size:14px; line-height:1.5; }

  /* ---------- Combined "everyone at a glance" bar ---------- */
  .combined-bar-wrap{
    background: var(--panel-raised);
    border:1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px 16px 16px;
    margin-bottom: 16px;
  }
  .combined-bar-headrow{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    margin-bottom:10px; flex-wrap:wrap;
  }
  .combined-bar-label{
    font-size:11px; font-weight:700; letter-spacing:.04em; text-transform:uppercase;
    color:var(--text-faint);
  }
  .combined-bar-preview-info{
    display:none; align-items:center; gap:8px;
    font-size:11.5px; font-weight:700; color:var(--accent);
  }
  .combined-bar-preview-info.show{ display:flex; }
  .combined-bar-preview-info button{
    background:var(--accent-soft); border:1px solid var(--accent);
    color:var(--accent); font-size:10.5px; font-weight:700;
    padding:2px 8px; border-radius:999px; cursor:pointer;
  }
  .combined-bar-preview-info button:hover{ background:var(--accent); color:var(--bg); }
  .combined-bar-hint{
    font-size:10.5px; color:var(--text-faint); margin-top:6px; text-align:center;
  }
  .combined-track{
    background: var(--night);
    transition: height .2s;
    cursor: grab;
    touch-action: pan-y;
  }
  .combined-track.dragging{ cursor: grabbing; }
  .combined-bubble{
    transform: translate(-50%, -50%);
    transition: left 0.6s cubic-bezier(.4,0,.2,1), top 0.2s;
  }

  /* ---------- Rows ---------- */
  .rows{ display:flex; flex-direction:column; gap:10px; }

  .person-row{
    background: var(--panel);
    border:1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px 16px 16px;
    position:relative;
    box-shadow: var(--row-shadow);
  }

  .row-top{
    display:flex; align-items:center; gap:10px; margin-bottom:10px;
  }
  .row-avatar{
    width:30px; height:30px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:14px; font-weight:700; color:var(--bg);
    flex-shrink:0; overflow:hidden;
    border: 2px solid rgba(255,255,255,0.12);
  }
  .row-avatar img{ width:100%; height:100%; object-fit:cover; }

  .row-name{ font-weight:650; font-size:14.5px; }
  .row-city{ color:var(--text-faint); font-size:12px; }
  .row-meta{ display:flex; flex-direction:column; gap:1px; margin-right:auto; min-width:0; }
  .row-meta .row-name{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  .row-time{
    font-family:var(--mono); font-size:15px; font-weight:600;
    color:var(--text);
    white-space:nowrap;
  }
  .row-time .ampm{ font-size:11px; color:var(--text-faint); margin-left:2px; }
  .row-daylabel{
    font-size:10.5px; padding:2px 7px; border-radius:6px;
    font-weight:700; letter-spacing:.03em; text-transform:uppercase;
    white-space:nowrap;
  }
  .row-daylabel.day{ background:rgba(124,156,255,0.18); color:#AFC1FF; }
  .row-daylabel.night{ background:rgba(255,255,255,0.06); color:var(--text-faint); }
  .row-daylabel.good{ background:rgba(111,207,151,0.16); color:var(--good); }

  .row-actions{ display:flex; gap:4px; margin-left:4px; }
  .row-actions button{
    width:26px;height:26px; border-radius:7px; border:none; background:transparent;
    color:var(--text-faint); cursor:pointer; font-size:13px;
    display:flex;align-items:center;justify-content:center;
    transition: background .15s, color .15s;
  }
  .row-actions button:hover{ background:var(--panel-raised); color:var(--text); }
  .row-actions .delBtn:hover{ background:var(--danger-soft); color:var(--danger); }

  .person-row.is-you{ border-color:var(--accent); }
  .you-badge{
    font-size:9.5px; font-weight:800; letter-spacing:.04em; text-transform:uppercase;
    color:var(--accent); background:var(--accent-soft);
    padding:2px 6px; border-radius:5px; margin-left:2px;
  }
  .row-avatar-you{
    width:36px; height:36px; font-size:16px;
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .row-time-you{ font-size:19px; font-weight:750; color:var(--accent); }

  /* the 24h track */
  .track-wrap{ position:relative; }
  .track{
    position:relative;
    height:34px;
    border-radius:9px;
    overflow:hidden;
    background: var(--night);
  }
  .track-gradient{
    position:absolute; inset:0;
    /* built per-row via inline background */
  }
  .track-hourlines{
    position:absolute; inset:0;
    display:flex;
  }
  .track-hourlines div{
    flex:1; border-right:1px solid rgba(255,255,255,0.045);
  }
  .track-hourlines div:last-child{ border-right:none; }

  .worktime-band{
    position:absolute; top:0; bottom:0;
    background: rgba(111,207,151,0.10);
    border-left:1px solid rgba(111,207,151,0.35);
    border-right:1px solid rgba(111,207,151,0.35);
  }

  .now-tick{
    position:absolute; top:-4px; bottom:-4px;
    width:2px; background: var(--accent);
    box-shadow: 0 0 8px 1px rgba(242,166,90,0.6);
    border-radius:2px;
  }

  .bubble{
    position:absolute; top:50%;
    width:26px; height:26px; border-radius:50%;
    transform: translate(-50%, -50%);
    display:flex; align-items:center; justify-content:center;
    font-size:12px; font-weight:800; color:var(--bg);
    border:2px solid var(--bubble-ring);
    box-shadow: 0 2px 8px rgba(0,0,0,0.45), 0 0 0 2px rgba(255,255,255,0.08);
    cursor:pointer;
    transition: left 0.6s cubic-bezier(.4,0,.2,1);
    overflow:hidden;
  }
  .bubble img{ width:100%; height:100%; object-fit:cover; }

  .hourscale{
    display:flex; margin-top:6px;
    font-family:var(--mono); font-size:9px; color:var(--text-faint);
  }
  .hourscale span{ flex:1; text-align:left; white-space:nowrap; }
  .hourscale span:nth-child(odd){ opacity:0; }
  @media (max-width:600px){
    .hourscale span:not(:nth-child(6n+1)){ opacity:0 !important; }
  }

  /* tooltip */
  .tooltip{
    position:fixed; z-index:200;
    background:#22263A; border:1px solid var(--line);
    color:var(--text); font-size:12.5px;
    padding:8px 11px; border-radius:9px;
    box-shadow:0 8px 24px rgba(0,0,0,0.4);
    pointer-events:none; white-space:nowrap;
    transform:translate(-50%,-130%);
    opacity:0; transition:opacity .1s;
  }
  .tooltip.show{ opacity:1; }
  .tooltip strong{ font-weight:700; }
  .tooltip .tt-city{ color:var(--text-dim); }

  /* ---------- Modal ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(8,9,14,0.6);
    backdrop-filter: blur(3px);
    display:flex; align-items:center; justify-content:center;
    z-index:100; padding:20px;
  }
  .modal{
    background: var(--panel);
    border:1px solid var(--line);
    border-radius:16px;
    width:100%; max-width:420px;
    padding:22px;
    max-height:88vh; overflow-y:auto;
  }
  .modal h2{ margin:0 0 4px; font-size:17px; }
  .modal .sub{ color:var(--text-faint); font-size:12.5px; margin:0 0 18px; }

  .field{ margin-bottom:15px; }
  .field label{ display:block; font-size:12px; font-weight:650; color:var(--text-dim); margin-bottom:6px; }
  .field input[type=text], .field select{
    width:100%; padding:10px 12px; border-radius:9px;
    background:var(--panel-raised); border:1px solid var(--line);
    color:var(--text); font-size:14px; font-family:inherit;
  }
  .field input:focus, .field select:focus{ border-color:var(--accent); }
  .field .hint{ font-size:11px; color:var(--text-faint); margin-top:5px; }

  .avatar-mode-tabs{ display:flex; gap:6px; margin-bottom:10px; flex-wrap:wrap; }
  .avatar-mode-tabs button{
    padding:6px 11px; border-radius:8px; border:1px solid var(--line);
    background:var(--panel-raised); color:var(--text-dim);
    font-size:12px; font-weight:600; cursor:pointer;
  }
  .avatar-mode-tabs button.active{ background:var(--accent); color:var(--bg); border-color:var(--accent); }

  .emoji-grid{ display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .emoji-grid button{
    width:34px; height:34px; border-radius:8px; border:1px solid var(--line);
    background:var(--panel-raised); font-size:16px; cursor:pointer;
  }
  .emoji-grid button.sel{ border-color:var(--accent); background:var(--accent-soft); }

  .color-grid{ display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
  .color-swatch{
    width:26px; height:26px; border-radius:50%; cursor:pointer;
    border:2px solid transparent;
  }
  .color-swatch.sel{ border-color:var(--text); }

  .avatar-preview{
    width:44px;height:44px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-weight:800; font-size:17px; color:var(--bg);
    margin: 0 auto 14px; overflow:hidden;
    border:2px solid rgba(255,255,255,0.12);
  }
  .avatar-preview img{ width:100%; height:100%; object-fit:cover; }

  .modal-actions{ display:flex; gap:10px; margin-top:20px; }
  .btn{
    flex:1; padding:11px; border-radius:10px; border:none;
    font-weight:700; font-size:13.5px; cursor:pointer;
    transition:opacity .15s, background .15s;
  }
  .btn-primary{ background:var(--accent); color:var(--bg); }
  .btn-primary:hover{ opacity:.92; }
  .btn-secondary{ background:var(--panel-raised); color:var(--text-dim); border:1px solid var(--line); }
  .btn-secondary:hover{ color:var(--text); }
  .btn-danger{ background:transparent; color:var(--danger); border:1px solid var(--danger); opacity:.75; }
  .btn-danger:hover{ background:var(--danger-soft); opacity:1; }

  .city-suggestions{
    max-height:170px; overflow-y:auto; margin-top:6px;
    border:1px solid var(--line); border-radius:9px; display:none;
    background:var(--panel-raised);
  }
  .city-suggestions.show{ display:block; }
  .city-suggestions div{
    padding:8px 12px; font-size:13px; cursor:pointer;
    display:flex; justify-content:space-between; gap:8px;
  }
  .city-suggestions div:hover{ background:var(--line); }
  .city-suggestions .csub{ color:var(--text-faint); font-size:11px; }

  footer{
    text-align:center; color:var(--text-faint); font-size:11.5px;
    padding: 10px 20px 30px;
  }
  footer a{ color:var(--text-dim); text-decoration:underline; text-decoration-color:var(--line); }

  /* ---------- Onboarding ---------- */
  .onboarding-overlay{
    position:fixed; inset:0; z-index:150;
    background: radial-gradient(1200px 800px at 15% -10%, var(--panel-raised) 0%, var(--bg) 60%);
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .onboarding-card{
    max-width:420px; width:100%; text-align:center;
  }
  .onboarding-card .glyph{ font-size:38px; margin-bottom:14px; }
  .onboarding-card h1{ font-size:24px; margin:0 0 8px; letter-spacing:-0.01em; }
  .onboarding-card p.sub{ color:var(--text-dim); font-size:14px; margin:0 0 26px; line-height:1.5; }
  .onboarding-card .field{ text-align:left; }
  .onboarding-card .modal-actions{ margin-top:22px; }
  .onboarding-skip{
    display:block; margin:14px auto 0; background:none; border:none;
    color:var(--text-faint); font-size:12.5px; text-decoration:underline;
    text-decoration-color:var(--line); cursor:pointer;
  }
  .onboarding-skip:hover{ color:var(--text-dim); }

  /* ---------- Guided tour ---------- */
  .tour-overlay{
    position:fixed; inset:0; z-index:160;
    background:rgba(5,6,10,0.72);
    backdrop-filter: blur(2px);
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .tour-card{
    background:var(--panel); border:1px solid var(--line); border-radius:18px;
    max-width:440px; width:100%; padding:26px; box-shadow:0 20px 60px rgba(0,0,0,0.45);
  }
  .tour-step-glyph{
    width:52px; height:52px; border-radius:14px;
    display:flex; align-items:center; justify-content:center;
    font-size:24px; background:var(--accent-soft); margin-bottom:16px;
  }
  .tour-card h2{ font-size:19px; margin:0 0 8px; letter-spacing:-0.01em; }
  .tour-card p{ color:var(--text-dim); font-size:13.5px; line-height:1.55; margin:0; }
  .tour-dots{ display:flex; gap:6px; margin-top:20px; }
  .tour-dot{ width:6px; height:6px; border-radius:50%; background:var(--line); transition:background .15s, width .15s; }
  .tour-dot.active{ background:var(--accent); width:18px; border-radius:3px; }
  .tour-actions{ display:flex; align-items:center; justify-content:space-between; margin-top:22px; gap:10px; }
  .tour-skip{
    background:none; border:none; color:var(--text-faint); font-size:12.5px;
    text-decoration:underline; text-decoration-color:var(--line); cursor:pointer;
  }
  .tour-skip:hover{ color:var(--text-dim); }
  .tour-next-group{ display:flex; gap:8px; }

  @media (prefers-reduced-motion: reduce){
    .bubble{ transition:none; }
    .pulse{ animation:none; }
  }

</style>
</head>

/* ---------------------------------------------------------------------------
 * TIME
 * -------------------------------------------------------------------------*/

/**
 * How "current time" is calculated for each person:
 * 1. We always start from the single true moment `new Date()` (i.e. UTC "now",
 *    the same instant everywhere).
 * 2. For each person, we ask the browser's Intl API to render that instant in
 *    their IANA timezone (e.g. "Asia/Kolkata"). Intl.DateTimeFormat handles
 *    daylight saving time correctly for us — we never hardcode a UTC offset.
 * 3. The result is their local wall-clock hour, used to position the bubble
 *    and to compute day/night + meeting-friendliness.
 * This means a person's row updates correctly across DST changes automatically,
 * as long as their IANA zone (e.g. "America/New_York") is correct — that's why
 * every place in the dataset stores a real IANA zone rather than a fixed offset.
 */

/**
 * "Fixed:<minutes>" is our own convention for a manually-chosen UTC offset
 * (used by the "can't find their city" fallback). Real IANA zones (e.g.
 * "Asia/Kolkata") support fractional-hour offsets like +5:30 or +5:45 via
 * Intl automatically, but Intl's Etc/GMT zones only support whole hours —
 * so manual offsets are handled with plain arithmetic instead, which works
 * for any offset including quarter-hours, and skips DST (documented in the UI).
 */
const FIXED_TZ_PREFIX = 'Fixed:';
function isFixedTz(tz) { return typeof tz === 'string' && tz.startsWith(FIXED_TZ_PREFIX); }
function fixedTzMinutes(tz) { return parseInt(tz.slice(FIXED_TZ_PREFIX.length), 10); }
function makeFixedTz(offsetMinutes) { return FIXED_TZ_PREFIX + offsetMinutes; }

/** Returns { hourFloat, hh, mm } — local wall-clock time in `tz` at instant `date`. */
function localTimeParts(tz, date) {
  if (isFixedTz(tz)) {
    const totalMin = (date.getTime() / 60000 + fixedTzMinutes(tz));
    const minsInDay = ((Math.floor(totalMin) % 1440) + 1440) % 1440;
    const hh = Math.floor(minsInDay / 60);
    const mm = minsInDay % 60;
    return { hourFloat: hh + mm / 60, hh, mm };
  }
  const fmt = new Intl.DateTimeFormat('en-US', {
    timeZone: tz, hour12: false,
    hour: '2-digit', minute: '2-digit', second: '2-digit'
  });
  const parts = fmt.formatToParts(date).reduce((acc, p) => { acc[p.type] = p.value; return acc; }, {});
  const hh = parseInt(parts.hour, 10) % 24;
  const mm = parseInt(parts.minute, 10);
  const ss = parseInt(parts.second, 10);
  return { hourFloat: hh + mm / 60 + ss / 3600, hh, mm };

function formatClock(tz, date) {
  if (isFixedTz(tz)) {
    const { hh, mm } = localTimeParts(tz, date);

    const h12 = hh % 12 === 0 ? 12 : hh % 12;

function utcOffsetMinutes(tz, date) {

    timeZone: tz, hour12: false,
    year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', second: '2-digit'
  });

/**

function sunTimes(lat, lon, tz, date) {

    if (score > 0) scored.push({ place, score });
  }

  scored.sort((a, b) => b.score - a.score || a.place.name.localeCompare(b.place.name));
  return scored.slice(0, limit).map(s => s.place);
}

/**
 * Common UTC-offset fallback list, used when someone can't find their city.
 * Lets anyone add a person by offset alone (see requirement: manual time entry
 * as a fallback to search). Not DST-aware — flagged in the UI as approximate.
 */
const UTC_OFFSETS = [];
for (let m = -720; m <= 840; m += 30) {
  const h = m / 60;
  const sign = h >= 0 ? '+' : '-';
  const abs = Math.abs(h);
  const hh = Math.floor(abs);
  const mm = Math.round((abs - hh) * 60);
  const label = `UTC${sign}${hh}${mm ? ':' + String(mm).padStart(2, '0') : ''}`;
  UTC_OFFSETS.push({ minutes: m, label });
}

/* ---------------------------------------------------------------------------
 * MEETING-TIME SCORING
 *
 * Goal: given a group of people (each with a timezone), suggest good times to
 * meet, without either of two failure modes:
 *   (a) a plain SUM of "how bad is this hour for each person" lets a large
 *       group's small conveniences outvote one person's severe inconvenience
 *       (e.g. it can rate waking one teammate at 3am as *better* than a slot
 *       where 20 people are each an hour later than ideal — worked through
 *       with worked examples before choosing this formula; see /tests).
 *   (b) a plain MAX (only look at the worst-off person) ignores the group
 *       entirely once the worst person is fixed, so it can't tell a slot
 *       where everyone else is great apart from that one person, from a slot
 *       where everyone else is *also* bad.
 *
 * Fix: score = a blend, weighted toward the worst-off person, so no team size
 * can dilute one person's bad slot into looking fine, while the average still
 * breaks ties between slots that are equally bad for the worst person.
 * -------------------------------------------------------------------------*/

const SCORING = {
  workStart: 9,   // 9am
  workEnd: 18,    // 6pm
  dayStart: 7,    // treated as "awake" from 7am
  dayEnd: 22,     // to 10pm
  worstWeight: 0.65 // how much the worst-affected person dominates the score
};

/**
 * Cost of a given local hour for one person. 0 = squarely in working hours.
 * The curve is smooth (no cliffs) so 8:59am and 9:01am aren't treated as
 * night-and-day different — a hard cutoff is exactly the kind of "synthetic,
 * rigid" scoring that produces silly rankings.
 */
function personHourCost(hourFloat, opts = SCORING) {
  const { workStart, workEnd, dayStart, dayEnd } = opts;
  if (hourFloat >= workStart && hourFloat < workEnd) return 0;

  const distToStart = Math.abs(hourFloat - workStart);
  const distToEnd = Math.abs(hourFloat - workEnd);
  let dist = Math.min(distToStart, distToEnd);
  dist = Math.min(dist, 24 - dist); // wrap around midnight

  const isAwake = hourFloat >= dayStart && hourFloat < dayEnd;
  if (isAwake) return dist * 0.35;               // outside work but awake: gentle ramp
  return 1.2 + dist * 0.9;                        // asleep: steep, plus a flat "waking someone" penalty
}

/**
 * Rounds an instant up to the next clean half-hour mark in UTC (`:00` or
 * `:30`). Used so every candidate meeting time we ever score or suggest
 * lands on a clean clock mark for people on whole- or half-hour UTC offsets
 * (the vast majority), rather than on whatever odd minute `new Date()`
 * happened to return (e.g. "7:07 PM").
 */
function snapUpToHalfHour(date) {
  const halfHourMs = 30 * 60000;
  const remainder = date.getTime() % halfHourMs;
  return remainder === 0 ? new Date(date.getTime()) : new Date(date.getTime() + (halfHourMs - remainder));
}

/**
 * Scores one candidate UTC instant for a list of people.
 * Returns { instant, score, avg, worst, worstPerson, perPerson: [{personId, cost, hour}] }
 */
function scoreInstant(people, instant, opts = SCORING) {
  const perPerson = people.map(p => {
    const { hourFloat } = localTimeParts(p.tz, instant);
    const cost = personHourCost(hourFloat, opts);
    return { personId: p.id, name: p.name, hour: hourFloat, cost };
  });
  const avg = perPerson.reduce((s, x) => s + x.cost, 0) / (perPerson.length || 1);
  const worstEntry = perPerson.reduce((a, b) => (b.cost > a.cost ? b : a), perPerson[0] || { cost: 0 });
  const worst = worstEntry ? worstEntry.cost : 0;
  const score = opts.worstWeight * worst + (1 - opts.worstWeight) * avg;
  return { instant, score, avg, worst, worstPerson: worstEntry ? worstEntry.name : null, perPerson };
}

/**
 * Given any instant (not necessarily on a clean mark), returns whichever of
 * the nearest clean half-hour marks (the one at/before it, or the one after)
 * scores better for the group — "round on the side of better score" rather
 * than always rounding to nearest-in-time. If the instant is already on a
 * clean mark, it's returned unchanged.
 */
function roundToBetterMark(people, instant, opts = SCORING) {
  const halfHourMs = 30 * 60000;
  const ms = instant.getTime();
  const remainder = ms % halfHourMs;
  if (remainder === 0) return instant;
  const down = new Date(ms - remainder);
  const up = new Date(down.getTime() + halfHourMs);
  const scoreDown = scoreInstant(people, down, opts).score;
  const scoreUp = scoreInstant(people, up, opts).score;
  return scoreDown <= scoreUp ? down : up;
}

/**
 * Suggests the best meeting slots for a group over the next 24h, sampled on
 * a clean 30-minute grid (:00 and :30 marks only — see snapUpToHalfHour), so
 * every suggestion is a time a human would actually propose (e.g. "5:00 PM",
 * "6:30 AM"), never an odd minute like "7:07 PM". Returns the top `topN`
 * distinct slots, sorted best first.
 */
function suggestMeetingTimes(people, fromDate = new Date(), topN = 3, opts = SCORING) {
  if (!people.length) return [];
  const gridStart = snapUpToHalfHour(fromDate);
  const candidates = [];
  for (let stepMin = 0; stepMin < 24 * 60; stepMin += 30) {
    const instant = new Date(gridStart.getTime() + stepMin * 60000);
    candidates.push(scoreInstant(people, instant, opts));
  }
  candidates.sort((a, b) => a.score - b.score);

  // De-duplicate slots that are within 90 minutes of an already-picked, better slot,
  // so we don't show three near-identical options clustered around one peak.
  const picked = [];
  for (const c of candidates) {
    if (picked.length >= topN) break;
    const tooClose = picked.some(p => Math.abs(p.instant - c.instant) < 90 * 60000);
    if (!tooClose) picked.push(c);
  }
  return picked;
}

/**
 * Assigns a vertical "lane" to each item so overlapping markers on a shared
 * axis (e.g. multiple people whose local time lands within `minGapPct` of
 * each other on a combined timeline) stack instead of drawing on top of one
 * another. `items` must each have a numeric `.pct` field (0-100). Greedy:
 * sort by position, reuse the first lane far enough from its last occupant,
 * otherwise open a new lane. Returns new objects (originals untouched) with
 * a `.lane` field added (0 = first/bottom lane).
 */
function assignLanes(items, minGapPct) {
  const sorted = items.slice().sort((a, b) => a.pct - b.pct);
  const laneLastPct = [];
  return sorted.map(item => {
    let lane = laneLastPct.findIndex(lastPct => Math.abs(item.pct - lastPct) >= minGapPct);
    if (lane === -1) { lane = laneLastPct.length; laneLastPct.push(item.pct); }
    else { laneLastPct[lane] = item.pct; }
    return { ...item, lane };
  });
}

/**
 * Formats a signed minute offset for the combined bar's drag-to-preview
 * label, e.g. 210 -> "+3h 30m", -45 -> "−45m", 120 -> "+2h".
 */
function formatOffsetLabel(minutes) {
  const sign = minutes >= 0 ? '+' : '−';
  const abs = Math.abs(minutes);
  const h = Math.floor(abs / 60), m = abs % 60;
  if (h === 0) return `${sign}${m}m`;
  if (m === 0) return `${sign}${h}h`;
  return `${sign}${h}h ${m}m`;
}

// Export for both browser (global) and Node (tests) use.
if (typeof module !== 'undefined' && module.exports) {
  module.exports = {
    localTimeParts, formatClock, utcOffsetMinutes, sunTimes,
    searchPlaces, UTC_OFFSETS,
    isFixedTz, fixedTzMinutes, makeFixedTz,
    SCORING, personHourCost, scoreInstant, suggestMeetingTimes,
    snapUpToHalfHour, roundToBetterMark, assignLanes, formatOffsetLabel
  };
}

</script>
<script>
// ============================================================================
// app.js — state management and DOM rendering, appended after data.js and
// core.js in index.html (all three are bundled into one file so the app
// never breaks from a missing/misordered script — see index.html for why).
// ============================================================================

if (typeof PLACES === 'undefined' || typeof searchPlaces === 'undefined') {
  // Defensive guard: if this file is ever split back into separate script
  // files (or edited in a way that breaks load order), fail loudly here
  document.body.innerHTML = '<div style="padding:40px;font-family:sans-serif;color:#E37373;max-width:520px;">' +
    '<h2>TimeTogether couldn\'t start</h2>' +
    '<p>A required script did not load (data.js / core.js). If you split this file back into separate files, ' +
    'make sure data.js and core.js load before app.js in your HTML. The single-file version avoids this entirely.</p>' +
    '</div>';
  throw new Error('TimeTogether: PLACES/searchPlaces not defined — data.js or core.js did not load before app.js.');
}

const EMOJI_OPTIONS = ["😀","😎","🦊","🐼","🐨","🐸","🦁","🐯","🐵","🦉","🐳","🌵","🌸","⚡","🔥","🌙","☀️","🍀","🎧","🚀","☕","🏄","🎨","📚"];
const COLOR_OPTIONS = ["#F2A65A","#7C9CFF","#6FCF97","#E37373","#C792EA","#5DD5C8","#F2D06B","#FF8FB1","#9AA5FF","#8AD6C7"];
const STORE_KEY = "timetogether_v2";
const THEME_KEY = "timetogether_theme";

/* ---------------------------------------------------------------------------
 * STATE
 * `state.me`, when set, is a single person-shaped record kept OUTSIDE every
 * group's people list, so it's defined once and pinned into every group's
 * view instead of being duplicated (and going stale) per group.
 * -------------------------------------------------------------------------*/

const uid = () => Math.random().toString(36).slice(2, 10);

function seedState() {
  const person = (name, cityName, emoji, color) => {
    const c = PLACES.find(p => p.name === cityName) || PLACES[0];
    return {
      id: uid(), name, nickname: '', city: c.name, tz: c.tz, lat: c.lat, lon: c.lon,
      avatarMode: 'emoji', emoji, photoUrl: '', color
    };
  };
  const g1 = {
    id: uid(), name: 'Example Team', sortByTime: false,
    people: [
      person('Mat', 'Madrid', '🎸', '#F2A65A'),
      // Clovis, CA isn't in the built-in city list; San Francisco shares the
      // exact same time zone (America/Los_Angeles), so it's a faithful
      // stand-in — see the README for how to do this for your own team.
      person('Carli', 'San Francisco', '🌉', '#7C9CFF'),
      person('Christine', 'Singapore', '🌺', '#6FCF97'),
      person('Pranav', 'Vancouver', '🏔️', '#E37373'),
    ]
  };
  return { activeGroup: g1.id, groups: [g1], me: null };
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return seedState();
    const parsed = JSON.parse(raw);
    if (!parsed.groups || !parsed.groups.length) return seedState();
    if (!('me' in parsed)) parsed.me = null;
    parsed.groups.forEach(g => { if (!('sortByTime' in g)) g.sortByTime = false; });
    return parsed;
  } catch (e) {
    console.warn('Could not read saved data, starting fresh.', e);
    return seedState();
  }
}

let state = loadState();
const save = () => localStorage.setItem(STORE_KEY, JSON.stringify(state));
const activeGroup = () => state.groups.find(g => g.id === state.activeGroup) || state.groups[0];

/* ---------------------------------------------------------------------------
 * DOM refs & small utilities
 * Defined before THEME below because applyTheme() calls el() immediately.
 * -------------------------------------------------------------------------*/

const el = (id) => document.getElementById(id);
const tabsEl = el('tabs');
const contentEl = el('content');
const panelTitleEl = el('panelTitle');
const nowReadoutEl = el('nowReadout');
const tooltipEl = el('tooltip');
const panelToolbarEl = el('panelToolbar');
const tabsFadeLeftEl = el('tabsFadeLeft');
const tabsFadeRightEl = el('tabsFadeRight');
const sortToggleEl = el('sortToggle');

/* ---------------------------------------------------------------------------
 * THEME
 * -------------------------------------------------------------------------*/

function loadTheme() {
  try { return localStorage.getItem(THEME_KEY) || 'dark'; }
  catch (e) { return 'dark'; }
}
function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  try { localStorage.setItem(THEME_KEY, theme); } catch (e) {}
  const btn = el('themeToggleBtn');
  if (btn) {
    // Icon shows what the button DOES (switch to the other theme), not the
    // current theme, matching how the sort-toggle etc. read elsewhere.
    btn.textContent = theme === 'dark' ? '☀' : '☾';
    btn.title = theme === 'dark' ? 'Switch to light theme' : 'Switch to dark theme';
  }
}
let currentTheme = loadTheme();
applyTheme(currentTheme);

function escapeHtml(s) {
  return (s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function avatarInner(p) {
  if (p.avatarMode === 'photo' && p.photoUrl) return `<img src="${escapeHtml(p.photoUrl)}" alt="">`;
  if (p.avatarMode === 'nickname' && p.nickname) return escapeHtml(p.nickname.slice(0, 3));
  if (p.avatarMode === 'emoji' && p.emoji) return p.emoji;
  const initials = p.name.split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase();
  return initials || '?';
}

function buildGradient(sunrise, sunset) {
  // Colors read from CSS custom properties so the gradient adapts to the
  // active theme instead of being hardcoded to dark-mode values.
  const rootStyle = getComputedStyle(document.documentElement);
  const dayColor = rootStyle.getPropertyValue('--day-fill').trim() || 'rgba(124,156,255,0.22)';
  const nightColor = rootStyle.getPropertyValue('--night-fill').trim() || 'rgba(10,11,18,0.9)';
  if (sunrise === null || sunset === null) return `linear-gradient(90deg, ${nightColor}, ${nightColor})`;
  const pct = h => (h / 24 * 100).toFixed(2) + '%';
  const fadeW = 0.7;
  const sr1 = Math.max(0, sunrise - fadeW), sr2 = Math.min(24, sunrise + fadeW);
  const ss1 = Math.max(0, sunset - fadeW), ss2 = Math.min(24, sunset + fadeW);
  return `linear-gradient(90deg,
    ${nightColor} 0%, ${nightColor} ${pct(sr1)},
    ${dayColor} ${pct(sr2)}, ${dayColor} ${pct(ss1)},
    ${nightColor} ${pct(ss2)}, ${nightColor} 100%)`;
}

/** "1 AM", "12 PM", etc. Full AM/PM instead of a bare "a"/"p" for readability (#9). */
function hourScaleLabels() {
  let s = '';
  for (let h = 0; h < 24; h++) {
    const h12 = h === 0 ? 12 : h > 12 ? h - 12 : h;
    const ampm = h < 12 ? 'AM' : 'PM';
    s += `<span>${h12} ${ampm}</span>`;
  }
  return s;
}

function showTooltip(e, text) {
  tooltipEl.textContent = text;
  tooltipEl.classList.add('show');
  positionTooltip(e);
}
function positionTooltip(e) {
  tooltipEl.style.left = e.clientX + 'px';
  tooltipEl.style.top = e.clientY + 'px';
}
function hideTooltip() { tooltipEl.classList.remove('show'); }

/* ---------------------------------------------------------------------------
 * RENDERING
 * -------------------------------------------------------------------------*/

function updateTabsFade() {
  if (!tabsEl || !tabsFadeLeftEl || !tabsFadeRightEl) return;
  const overflowing = tabsEl.scrollWidth > tabsEl.clientWidth + 2;
  tabsFadeLeftEl.classList.toggle('show', overflowing && tabsEl.scrollLeft > 4);
  tabsFadeRightEl.classList.toggle('show', overflowing && tabsEl.scrollLeft < tabsEl.scrollWidth - tabsEl.clientWidth - 4);
}
if (tabsEl) tabsEl.addEventListener('scroll', updateTabsFade);
window.addEventListener('resize', updateTabsFade);

function renderTabs() {
  tabsEl.innerHTML = '';
  state.groups.forEach(g => {
    const t = document.createElement('div');
    t.className = 'tab' + (g.id === state.activeGroup ? ' active' : '');
    t.setAttribute('role', 'button');
    t.tabIndex = 0;
    t.innerHTML = `<span>${escapeHtml(g.name)}</span><span class="count">${g.people.length}</span>`;
    t.addEventListener('click', () => { resetCombinedBarPreview(); state.activeGroup = g.id; save(); renderAll(); });
    t.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') t.click(); });
    tabsEl.appendChild(t);
  });
  // Fade indicators need layout to settle before measuring scrollWidth.
  requestAnimationFrame(updateTabsFade);
}

function renderPanelTitle() {
  panelTitleEl.value = activeGroup().name;
  const deleteBtn = el('deleteGroupBtn');
  // Disable rather than hide when it's the only group left, so it's clear
  // deletion is possible in principle but there's always at least one group.
  deleteBtn.disabled = state.groups.length <= 1;
  deleteBtn.title = deleteBtn.disabled ? "Can't delete your only group" : 'Delete this group';
}

function deleteActiveGroup() {
  const g = activeGroup();
  if (state.groups.length <= 1) return; // guarded in the UI too, but never allow zero groups
  const ok = confirm(`Delete "${g.name}"? This removes everyone in it. This can't be undone.`);
  if (!ok) return;
  const idx = state.groups.findIndex(x => x.id === g.id);
  state.groups.splice(idx, 1);
  // Land on a sensible neighboring group rather than always jumping to the first.
  const next = state.groups[idx] || state.groups[idx - 1] || state.groups[0];
  state.activeGroup = next.id;
  save();
  renderAll();
}
el('deleteGroupBtn').addEventListener('click', deleteActiveGroup);

function renderPanelToolbar() {
  const g = activeGroup();
  const effectiveCount = g.people.length + (state.me ? 1 : 0);
  panelToolbarEl.innerHTML = `
    <button class="add-person-btn" id="addPersonBtn" type="button">+ Add person</button>
    ${effectiveCount >= 2 ? `<button class="suggest-btn" id="suggestBtn" type="button">✨ Suggest meeting times</button>` : ''}
  `;
  el('addPersonBtn').addEventListener('click', () => openPersonModal());
  const suggestBtn = el('suggestBtn');
  if (suggestBtn) suggestBtn.addEventListener('click', () => openSuggestModal());

  sortToggleEl.classList.toggle('active', !!g.sortByTime);
  sortToggleEl.setAttribute('aria-pressed', g.sortByTime ? 'true' : 'false');
}

sortToggleEl.addEventListener('click', () => {
  const g = activeGroup();
  g.sortByTime = !g.sortByTime;
  save(); renderPanelToolbar(); renderContent();
});
sortToggleEl.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') sortToggleEl.click(); });

/** People to actually display for a group: "me" pinned first (if set), then
 * the group's own people, optionally sorted earliest-to-latest local time. */
function displayPeopleFor(g, now) {
  const list = state.me ? [{ ...state.me, isMe: true }, ...g.people] : g.people.slice();
  if (!g.sortByTime) return list;
  return list
    .map(p => ({ p, hourFloat: localTimeParts(p.tz, now).hourFloat }))
    .sort((a, b) => a.hourFloat - b.hourFloat)
    .map(x => x.p);
}

/** Module-level preview state for the combined bar's drag-to-preview feature.
 * Deliberately NOT part of `state` (never saved) -- it's a transient view,
 * not data. Reset on group switch, after 60s idle, or via the Reset button. */
const combinedBarPreview = { offsetMinutes: 0, idleTimer: null };

function resetCombinedBarPreview() {
  combinedBarPreview.offsetMinutes = 0;
  if (combinedBarPreview.idleTimer) { clearTimeout(combinedBarPreview.idleTimer); combinedBarPreview.idleTimer = null; }
}
function schedulePreviewAutoReset() {
  if (combinedBarPreview.idleTimer) clearTimeout(combinedBarPreview.idleTimer);
  combinedBarPreview.idleTimer = setTimeout(() => {
    resetCombinedBarPreview();
    renderContent();
  }, 60000); // auto-reset after a minute of no dragging, so a stale preview can't be mistaken for real time
}

/** Renders just the track + bubbles + hourscale for the combined bar, given
 * a (possibly preview-shifted) instant. Kept separate from the wrapper/label
 * so dragging can re-render this part alone without touching drag listeners
 * attached to the wrapper. */
function renderCombinedTrackContents(people, instant) {
  const items = people.map(p => {
    const { hourFloat } = localTimeParts(p.tz, instant);
    return { p, hourFloat, pct: hourFloat / 24 * 100 };
  });
  const laned = assignLanes(items, 4.5);
  const laneCount = Math.max(...laned.map(x => x.lane)) + 1;

  const workLeft = (SCORING.workStart / 24 * 100).toFixed(3);
  const workWidth = ((SCORING.workEnd - SCORING.workStart) / 24 * 100).toFixed(3);
  const trackHeight = 26 + (laneCount - 1) * 24;

  const bubbles = laned.map(({ p, hourFloat, pct, lane }) => {
    const clock = formatClock(p.tz, instant);
    const top = 13 + lane * 24;
    return `<div class="bubble combined-bubble" style="left:${pct.toFixed(3)}%; top:${top}px; background:${p.color}" data-tip="${escapeHtml(p.name)}${p.isMe ? ' (you)' : ''} · ${escapeHtml(p.city)} · ${clock}">${avatarInner(p)}</div>`;
  }).join('');

  return { trackHeight, workLeft, workWidth, bubbles };
}

/** Renders the "everyone at a glance" combined bar: one shared 24h axis on
 * the viewer's own local day (not any one teammate's), with every person's
 * bubble placed at their current time on that shared axis. Day/night shading
 * isn't shown here (it would only be true for one person), just a neutral
 * 9am-6pm band on the viewer's own clock, so it reads as "who's near MY
 * working hours right now" rather than implying a false shared day/night.
 *
 * Draggable: click-and-drag anywhere on the track to preview a different
 * shared instant -- every bubble shifts together, so you can visually hunt
 * for a time that works for everyone. Purely a view-layer preview (never
 * saved), auto-resets after 60s idle or via the Reset control. */
function renderCombinedBar(people, now) {
  if (people.length < 2) return ''; // not useful with 0-1 people, and avoids an empty/lonely bar

  const previewInstant = new Date(now.getTime() + combinedBarPreview.offsetMinutes * 60000);
  const isPreviewing = combinedBarPreview.offsetMinutes !== 0;
  const { trackHeight, workLeft, workWidth, bubbles } = renderCombinedTrackContents(people, previewInstant);

  return `
  <div class="combined-bar-wrap">
    <div class="combined-bar-headrow">
      <div class="combined-bar-label">Everyone, on your clock</div>
      <div class="combined-bar-preview-info${isPreviewing ? ' show' : ''}" id="combinedPreviewInfo">
        <span id="combinedPreviewLabel">Previewing ${formatOffsetLabel(combinedBarPreview.offsetMinutes)}</span>
        <button type="button" id="combinedResetBtn">Reset</button>
      </div>
    </div>
    <div class="track-wrap">
      <div class="track combined-track" id="combinedTrack" style="height:${trackHeight}px">
        <div class="worktime-band" style="left:${workLeft}%; width:${workWidth}%"></div>
        <div class="track-hourlines">${'<div></div>'.repeat(24)}</div>
        ${bubbles}
      </div>
      <div class="hourscale">${hourScaleLabels()}</div>
    </div>
    <div class="combined-bar-hint">Drag the bar to preview another time for everyone</div>
  </div>`;
}

/** Shared, module-level drag state for the combined bar. Only one drag can
 * be active at a time (there's only one combined bar on screen), so this is
 * simpler and safer than per-render closures, which would otherwise leak a
 * fresh set of document-level mousemove/mouseup listeners on every single
 * re-render (every 30s, every group switch, every add/remove person). */
const combinedBarDrag = { active: false, startX: 0, startOffsetMinutes: 0, people: null };

function updateCombinedPreviewFromDrag(clientX) {
  const track = el('combinedTrack');
  if (!track) { combinedBarDrag.active = false; return; }
  const rect = track._dragStartRect || track.getBoundingClientRect();
  const minutesPerPixel = rect.width > 0 ? (24 * 60) / rect.width : 0;
  const deltaPx = clientX - combinedBarDrag.startX;
  const rawMinutes = combinedBarDrag.startOffsetMinutes + deltaPx * minutesPerPixel;
  // Snap the preview to a clean half-hour mark, consistent with how meeting
  // suggestions are rounded elsewhere in the app.
  combinedBarPreview.offsetMinutes = Math.round(rawMinutes / 30) * 30;

  const now = new Date();
  const previewInstant = new Date(now.getTime() + combinedBarPreview.offsetMinutes * 60000);
  const { trackHeight, workLeft, workWidth, bubbles } = renderCombinedTrackContents(combinedBarDrag.people, previewInstant);
  track.style.height = trackHeight + 'px';
  track.innerHTML = `
    <div class="worktime-band" style="left:${workLeft}%; width:${workWidth}%"></div>
    <div class="track-hourlines">${'<div></div>'.repeat(24)}</div>
    ${bubbles}`;
  track.querySelectorAll('.bubble').forEach(bubble => {
    bubble.addEventListener('mouseenter', e => showTooltip(e, bubble.dataset.tip));
    bubble.addEventListener('mousemove', positionTooltip);
    bubble.addEventListener('mouseleave', hideTooltip);
  });
  const infoEl = el('combinedPreviewInfo');
  const labelEl = el('combinedPreviewLabel');
  if (infoEl && labelEl) {
    const isPreviewing = combinedBarPreview.offsetMinutes !== 0;
    infoEl.classList.toggle('show', isPreviewing);
    labelEl.textContent = `Previewing ${formatOffsetLabel(combinedBarPreview.offsetMinutes)}`;
  }
  schedulePreviewAutoReset();
}

function endCombinedBarDrag() {
  if (!combinedBarDrag.active) return;
  combinedBarDrag.active = false;
  const track = el('combinedTrack');
  if (track) track.classList.remove('dragging');
}

// Registered ONCE at load time, not per-render -- see combinedBarDrag comment above.
document.addEventListener('mousemove', e => { if (combinedBarDrag.active) updateCombinedPreviewFromDrag(e.clientX); });
document.addEventListener('mouseup', endCombinedBarDrag);
document.addEventListener('touchmove', e => { if (combinedBarDrag.active) updateCombinedPreviewFromDrag(e.touches[0].clientX); }, { passive: true });
document.addEventListener('touchend', endCombinedBarDrag);

/** Re-attaches the drag START listeners to the (freshly rendered) track
 * element itself. Safe to call on every render: the track element is a new
 * DOM node each time (innerHTML replaced it), so old listeners on the old
 * node are simply discarded by the browser -- no leak, unlike document-level
 * listeners which would persist across renders if re-added each time. */
function wireCombinedBarDrag(people) {
  const track = el('combinedTrack');
  if (!track) return;
  combinedBarDrag.people = people; // used by the shared document-level move handler above

  const resetBtn = el('combinedResetBtn');
  if (resetBtn) resetBtn.addEventListener('click', () => {
    resetCombinedBarPreview();
    renderContent();
  });

  track.addEventListener('mousedown', e => {
    combinedBarDrag.active = true;
    combinedBarDrag.startX = e.clientX;
    combinedBarDrag.startOffsetMinutes = combinedBarPreview.offsetMinutes;
    track._dragStartRect = track.getBoundingClientRect();
    track.classList.add('dragging');
    e.preventDefault();
  });
  track.addEventListener('touchstart', e => {
    combinedBarDrag.active = true;
    combinedBarDrag.startX = e.touches[0].clientX;
    combinedBarDrag.startOffsetMinutes = combinedBarPreview.offsetMinutes;
    track._dragStartRect = track.getBoundingClientRect();
    track.classList.add('dragging');
  }, { passive: true });
}

function renderContent() {
  const g = activeGroup();
  const now = new Date();
  const people = displayPeopleFor(g, now);

  if (!people.length) {
    contentEl.innerHTML = `
      <div class="empty-state">
        <div class="glyph">🌍</div>
        <h3>No one in this group yet</h3>
        <p>Use "+ Add person" above to add a teammate — you'll see exactly where they are in their day, updating live.</p>
      </div>`;
    return;
  }

  let html = renderCombinedBar(people, now) + `<div class="rows">`;
  people.forEach(p => {
    const { hourFloat } = localTimeParts(p.tz, now);
    const clock = formatClock(p.tz, now);
    const [time, ampm] = clock.split(' ');
    const sun = sunTimes(p.lat, p.lon, p.tz, now);
    const gradient = buildGradient(sun.sunrise, sun.sunset);
    const leftPct = (hourFloat / 24 * 100).toFixed(3);

    let isDay = sun.sunrise !== null && sun.sunset !== null
      ? (hourFloat >= sun.sunrise && hourFloat <= sun.sunset)
      : true;
    const cost = personHourCost(hourFloat);
    let labelClass = 'night', labelText = 'Night';
    if (cost === 0) { labelClass = 'good'; labelText = 'Working hrs'; }
    else if (isDay) { labelClass = 'day'; labelText = 'Day'; }

    const workLeft = (SCORING.workStart / 24 * 100).toFixed(3);
    const workWidth = ((SCORING.workEnd - SCORING.workStart) / 24 * 100).toFixed(3);

    const actions = p.isMe
      ? `<div class="row-actions"><button class="editBtn" title="Edit your info" aria-label="Edit your info">✎</button></div>`
      : `<div class="row-actions">
           <button class="editBtn" title="Edit" aria-label="Edit ${escapeHtml(p.name)}">✎</button>
           <button class="delBtn" title="Remove from this group" aria-label="Remove ${escapeHtml(p.name)}">🗑</button>
         </div>`;

    html += `
    <div class="person-row${p.isMe ? ' is-you' : ''}" data-id="${p.id}" data-is-me="${!!p.isMe}">
      <div class="row-top">
        <div class="row-avatar${p.isMe ? ' row-avatar-you' : ''}" style="background:${p.color}">${avatarInner(p)}</div>
        <div class="row-meta">
          <div class="row-name">${escapeHtml(p.name)}${p.isMe ? '<span class="you-badge">You</span>' : ''}</div>
          <div class="row-city">${escapeHtml(p.city)}</div>
        </div>
        <div class="row-daylabel ${labelClass}">${labelText}</div>
        <div class="row-time${p.isMe ? ' row-time-you' : ''}">${time}<span class="ampm">${ampm}</span></div>
        ${actions}
      </div>
      <div class="track-wrap">
        <div class="track">
          <div class="track-gradient" style="background:${gradient}"></div>
          <div class="worktime-band" style="left:${workLeft}%; width:${workWidth}%"></div>
          <div class="track-hourlines">${'<div></div>'.repeat(24)}</div>
          <div class="now-tick" style="left:${leftPct}%"></div>
          <div class="bubble" style="left:${leftPct}%; background:${p.color}" data-tip="${escapeHtml(p.name)} · ${escapeHtml(p.city)} · ${clock}">${avatarInner(p)}</div>
        </div>
        <div class="hourscale">${hourScaleLabels()}</div>
      </div>
    </div>`;
  });
  html += `</div>`;
  contentEl.innerHTML = html;

  // Wire tooltips for every bubble on the page, including the combined bar's.
  contentEl.querySelectorAll('.bubble').forEach(bubble => {
    bubble.addEventListener('mouseenter', e => showTooltip(e, bubble.dataset.tip));
    bubble.addEventListener('mousemove', positionTooltip);
    bubble.addEventListener('mouseleave', hideTooltip);
  });

  wireCombinedBarDrag(people);

  people.forEach(p => {
    const row = contentEl.querySelector(`.person-row[data-id="${p.id}"]`);
    if (!row) return;
    row.querySelector('.editBtn').addEventListener('click', () => {
      if (p.isMe) openOnboarding({ editing: true });
      else openPersonModal(p.id);
    });
    const delBtn = row.querySelector('.delBtn');
    if (delBtn) delBtn.addEventListener('click', () => {
      if (confirm(`Remove ${p.name} from this group?`)) {
        g.people = g.people.filter(x => x.id !== p.id);
        save(); renderAll();
      }
    });
  });
}

function renderNowReadout() {
  nowReadoutEl.textContent = new Date().toLocaleString('en-US', {
    weekday: 'short', hour: 'numeric', minute: '2-digit', hour12: true
  }) + ' (your time)';
}

function renderAll() {
  renderTabs();
  renderPanelTitle();
  renderPanelToolbar();
  renderContent();
  renderNowReadout();
}
